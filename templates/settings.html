{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block page_sub %}Account and profile{% endblock %}

{% block content %}

<div class="card" style="max-width:480px;">
  <h2>Account Settings</h2>
  <form method="POST" action="{{ url_for('settings') }}">
    <div class="form-row">
      <label for="full_name">Full Name</label>
      <input type="text" id="full_name" name="full_name" value="{{ current_user.full_name }}">
    </div>

    <div class="form-row">
      <label>Email</label>
      <input type="text" value="{{ current_user.email }}" disabled>
    </div>

    <div class="form-row">
      <label>Role</label>
      <input type="text" value="{{ current_user.role }}" disabled>
    </div>

    <button type="submit">Save Changes</button>
  </form>
</div>

{% endblock %}
