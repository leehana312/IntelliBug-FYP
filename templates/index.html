<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IntelliBug &mdash; Submit a Bug</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <span class="logo">IntelliBug</span>
    <span class="tagline">Bug severity classification &amp; solution recommendation</span>
  </div>
</header>

<main class="wrap">

  <section class="panel">
    <h1>Submit a bug</h1>
    <p class="lede">Describe the issue. IntelliBug predicts its severity and suggests a fix.</p>

    <form id="bug-form">
      <label for="title">Bug title</label>
      <input type="text" id="title" name="title" placeholder="e.g. Login page crashes on invalid password" required>

      <label for="description">Bug description</label>
      <textarea id="description" name="description" rows="6" placeholder="Steps to reproduce, expected behavior, actual behavior..." required></textarea>

      <button type="submit" id="submit-btn">Classify bug</button>
    </form>
  </section>

  <section class="panel result-panel" id="result-panel" hidden>
    <h2>Result</h2>

    <div class="result-row">
      <span class="result-label">Predicted severity</span>
      <span class="badge" id="severity-badge">&mdash;</span>
    </div>

    <div class="result-row stacked">
      <span class="result-label">Recommended solution</span>
      <p class="recommendation" id="recommendation-text">&mdash;</p>
    </div>
  </section>

  <p class="error" id="error-msg" hidden></p>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
